---
# Stands up a complete, real, disposable surviva sandbox: an AMI with CRIU +
# surviva pre-baked, this project's own infra/terraform control-plane, a
# real Spot instance running the daemon with a demo job already tracked,
# and (by default) a ready-to-fire AWS FIS experiment template targeting it.
#
# This is real AWS infrastructure that costs real money while it exists --
# run destroy_sandbox.yml when you're done. See ../README.md first.
#
# Terraform is applied three times on purpose, not two:
#   pass 1 - a placeholder launch_template_id, just to materialize the
#            instance profile ami_build and launch_template both need.
#   pass 2 - the real launch_template_id, materializing the restore
#            orchestrator (state machine, EventBridge rule, checkpoint
#            storage) -- but NOT the FIS template yet, since that needs the
#            sandbox instance's own ARN, which doesn't exist until after
#            this pass.
#   pass 3 - once the sandbox instance is running, its real ARN is passed
#            in and the FIS template is created targeting it.

- name: Set up the surviva sandbox
  hosts: localhost
  connection: local
  gather_facts: true
  # Loaded explicitly rather than relying on ansible's cwd/inventory-relative
  # group_vars auto-discovery, which doesn't find ../group_vars/all.yml from
  # here regardless of where ansible-playbook is invoked from.
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: "Preflight: required variables are set"
      ansible.builtin.assert:
        that:
          - subnet_id | length > 0
          - availability_zone | length > 0
        fail_msg: >-
          subnet_id and availability_zone must be set (in group_vars/all.yml
          or via -e) before running this playbook. There is deliberately no
          default-VPC auto-discovery -- see ../README.md.

    - name: "Preflight: required tools are on PATH"
      ansible.builtin.command:
        argv: [which, "{{ item }}"]
      loop: [terraform, go, aws]
      changed_when: false

    - name: "Preflight: AWS credentials resolve"
      ansible.builtin.command:
        argv: [aws, sts, get-caller-identity, --output, json]
      changed_when: false

    - name: "Preflight: the target subnet actually exists"
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        subnet_ids: ["{{ subnet_id }}"]
      register: _subnet_check
      failed_when: _subnet_check.subnets | length == 0

    - name: "Preflight: ensure the target subnet auto-assigns public IPs"
      # Every instance this sandbox launches (the AMI builder, the sandbox
      # instance, and any orchestrator-launched replacement) needs a route
      # to the internet to reach SSM. A subnet-level setting is the only way
      # to get that for the replacement instance too, since its launch comes
      # from the orchestrator's own Step Functions definition (not this
      # playbook) and can't be given per-instance network overrides without
      # conflicting with the launch template + SubnetId combination it uses.
      # Skipped if the subnet already auto-assigns, or if it has no NAT
      # gateway/SSM VPC endpoints and a public IP genuinely is the only path.
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ _subnet_check.subnets[0].vpc_id }}"
        cidr: "{{ _subnet_check.subnets[0].cidr_block }}"
        region: "{{ aws_region }}"
        map_public: true
      when: not _subnet_check.subnets[0].map_public_ip_on_launch

    - name: Ensure the local build output directory exists
      ansible.builtin.file:
        path: "{{ local_build_dir }}"
        state: directory
        mode: "0755"

    - name: Build the surviva binary for Linux/amd64
      ansible.builtin.command:
        cmd: "go build -o {{ local_build_dir }}/surviva ./cmd/surviva"
        chdir: "{{ repo_root }}"
      environment:
        GOOS: linux
        GOARCH: amd64
      changed_when: true

  tasks:
    - name: "Terraform: init and select the sandbox workspace"
      ansible.builtin.include_role:
        name: terraform_infra
        tasks_from: init

    - name: "Terraform: apply (pass 1 - placeholder launch template, materializes the instance profile)"
      ansible.builtin.include_role:
        name: terraform_infra
        tasks_from: apply
      vars:
        tf_vars:
          name_prefix: "{{ name_prefix }}"
          aws_region: "{{ aws_region }}"
          launch_template_id: "lt-00000000000000000"
          enable_s3_bucket: "{{ storage_mode == 's3' }}"
          create_fis_demo_template: false

    - name: "Terraform: read pass-1 outputs (instance profile name)"
      ansible.builtin.include_role:
        name: terraform_infra
        tasks_from: read_outputs

    - name: Bake the sandbox AMI (CRIU {{ criu_git_ref }} + surviva pre-installed)
      ansible.builtin.include_role:
        name: ami_build

    - name: Create the checkpoint EBS volume (EBS storage mode only)
      ansible.builtin.include_role:
        name: ebs_storage
      when: storage_mode == 'ebs'

    - name: Create the sandbox launch template
      ansible.builtin.include_role:
        name: launch_template

    - name: "Terraform: apply (pass 2 - real launch template, materializes the restore orchestrator)"
      ansible.builtin.include_role:
        name: terraform_infra
        tasks_from: apply
      vars:
        tf_vars:
          name_prefix: "{{ name_prefix }}"
          aws_region: "{{ aws_region }}"
          launch_template_id: "{{ launch_template_id }}"
          az_subnet_map: "{{ az_subnet_map }}"
          enable_s3_bucket: "{{ storage_mode == 's3' }}"
          create_fis_demo_template: false
          replacement_market_type: "{{ replacement_market_type }}"

    - name: "Terraform: re-read outputs (checkpoint bucket/table names now final)"
      ansible.builtin.include_role:
        name: terraform_infra
        tasks_from: read_outputs

    - name: Launch the sandbox instance, wait for it to be ready, and track a demo job
      ansible.builtin.include_role:
        name: sandbox_instance

    - name: Build the sandbox instance's ARN (the FIS experiment's target)
      ansible.builtin.set_fact:
        _sandbox_instance_arn: "arn:aws:ec2:{{ aws_region }}:{{ aws_account_id }}:instance/{{ sandbox_instance_id }}"
      when: create_fis_demo_template

    - name: "Terraform: apply (pass 3 - create the FIS demo template targeting the real instance)"
      ansible.builtin.include_role:
        name: terraform_infra
        tasks_from: apply
      vars:
        tf_vars:
          name_prefix: "{{ name_prefix }}"
          aws_region: "{{ aws_region }}"
          launch_template_id: "{{ launch_template_id }}"
          az_subnet_map: "{{ az_subnet_map }}"
          enable_s3_bucket: "{{ storage_mode == 's3' }}"
          create_fis_demo_template: true
          fis_target_instance_arn: "{{ _sandbox_instance_arn }}"
          fis_interruption_delay: "{{ fis_interruption_delay }}"
          replacement_market_type: "{{ replacement_market_type }}"
      when: create_fis_demo_template

    - name: "Terraform: final read of outputs (FIS template id, if created)"
      ansible.builtin.include_role:
        name: terraform_infra
        tasks_from: read_outputs

    - name: Save sandbox facts and print the usage summary
      ansible.builtin.include_role:
        name: sandbox_facts
        tasks_from: save
