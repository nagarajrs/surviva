---
# Reusable "run this shell script on a real instance via SSM RunCommand and
# wait for it" building block. No native Ansible module manages SSM
# RunCommand's send/poll lifecycle, so this wraps the AWS CLI directly --
# the exact send-command/get-command-invocation pattern already validated
# by hand throughout this project (see docs/testing-strategy/technical.md).
#
# in:  ssm_instance_id, ssm_script (multi-line string), ssm_timeout (seconds, default 600)
# out: ssm_result (the full get-command-invocation response, on success)

- name: Ensure the facts directory exists (this role can run before sandbox_facts does)
  ansible.builtin.file:
    path: "{{ facts_dir }}"
    state: directory
    mode: "0700"

- name: Write SSM command parameters file (JSON, to avoid any shell-quoting fragility)
  ansible.builtin.copy:
    content: "{{ {'commands': ['echo ' + (ssm_script | b64encode) + ' | base64 -d > /tmp/_ansible_ssm.sh', 'bash /tmp/_ansible_ssm.sh']} | to_json }}"
    dest: "{{ facts_dir }}/.ssm_params.json"
    mode: "0600"
  changed_when: false

- name: Send command via SSM
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - send-command
      - --instance-ids
      - "{{ ssm_instance_id }}"
      - --document-name
      - AWS-RunShellScript
      - --parameters
      - "file://{{ facts_dir }}/.ssm_params.json"
      - --timeout-seconds
      - "{{ (ssm_timeout | default(600)) | string }}"
      - --region
      - "{{ aws_region }}"
      - --output
      - json
  register: _ssm_send
  changed_when: true

- name: Extract SSM command id
  ansible.builtin.set_fact:
    _ssm_command_id: "{{ (_ssm_send.stdout | from_json).Command.CommandId }}"

- name: Give the command a moment to register before polling
  ansible.builtin.pause:
    seconds: 2

- name: Poll until the SSM command leaves Pending/InProgress
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - get-command-invocation
      - --command-id
      - "{{ _ssm_command_id }}"
      - --instance-id
      - "{{ ssm_instance_id }}"
      - --region
      - "{{ aws_region }}"
      - --output
      - json
  register: _ssm_poll
  until: (_ssm_poll.stdout | from_json).Status not in ['Pending', 'InProgress']
  retries: "{{ ((ssm_timeout | default(600)) / 5) | round(0, 'ceil') | int }}"
  delay: 5
  changed_when: false

- name: Fail with the command's own stdout/stderr if it didn't succeed
  ansible.builtin.fail:
    msg: |
      SSM command failed on {{ ssm_instance_id }} (status={{ (_ssm_poll.stdout | from_json).Status }}):
      --- stdout ---
      {{ (_ssm_poll.stdout | from_json).StandardOutputContent }}
      --- stderr ---
      {{ (_ssm_poll.stdout | from_json).StandardErrorContent }}
  when: (_ssm_poll.stdout | from_json).Status != 'Success'

- name: Record the successful result for the caller
  ansible.builtin.set_fact:
    ssm_result: "{{ _ssm_poll.stdout | from_json }}"
