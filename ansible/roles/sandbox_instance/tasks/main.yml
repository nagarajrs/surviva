---
# Launches the real sandbox Spot instance from the launch template, waits
# for it to be reachable, attaches the checkpoint EBS volume if applicable,
# and (optionally) tracks a demo job so there's something to see right away.
#
# No Ansible module can launch a Spot instance from a launch template --
# amazon.aws.ec2_instance explicitly doesn't support Spot, and
# amazon.aws.ec2_spot_instance has no launch_template option -- so this
# shells out to the exact `aws ec2 run-instances` invocation already
# validated in docs/deployment/technical.md.

- name: Launch the sandbox instance as a real Spot instance
  ansible.builtin.command:
    argv:
      - aws
      - ec2
      - run-instances
      - --launch-template
      - "LaunchTemplateId={{ launch_template_id }}"
      - --instance-market-options
      - "MarketType=spot"
      - --subnet-id
      - "{{ subnet_id }}"
      - --tag-specifications
      - "ResourceType=instance,Tags=[{Key=Name,Value={{ name_prefix }}-sandbox},{Key=surviva-sandbox,Value={{ name_prefix }}}]"
      - --region
      - "{{ aws_region }}"
      - --output
      - json
  register: _sandbox_run
  changed_when: true

- name: Extract the sandbox instance id
  ansible.builtin.set_fact:
    sandbox_instance_id: "{{ (_sandbox_run.stdout | from_json).Instances[0].InstanceId }}"

- name: Wait for the sandbox instance to reach running
  amazon.aws.ec2_instance_info:
    region: "{{ aws_region }}"
    instance_ids: ["{{ sandbox_instance_id }}"]
  register: _sandbox_state
  until: _sandbox_state.instances[0].state.name == 'running'
  retries: 30
  delay: 10

- name: Wait for the sandbox instance to register with SSM
  ansible.builtin.command:
    argv: [aws, ssm, describe-instance-information, --filters, "Key=InstanceIds,Values={{ sandbox_instance_id }}", --region, "{{ aws_region }}", --output, json]
  register: _ssm_info
  until: >-
    (_ssm_info.stdout | from_json).InstanceInformationList | length > 0
    and (_ssm_info.stdout | from_json).InstanceInformationList[0].PingStatus == 'Online'
  retries: 30
  delay: 10
  changed_when: false

- name: Attach the checkpoint EBS volume (EBS mode only)
  amazon.aws.ec2_vol:
    id: "{{ ebs_volume_id }}"
    instance: "{{ sandbox_instance_id }}"
    device_name: "{{ ebs_attach_device }}"
    delete_on_termination: false
    region: "{{ aws_region }}"
  when: storage_mode == 'ebs'

- name: Confirm the daemon actually came up
  ansible.builtin.include_role:
    name: ssm_command
  vars:
    ssm_instance_id: "{{ sandbox_instance_id }}"
    ssm_timeout: 60
    ssm_script: |
      set -e
      systemctl is-active surviva-daemon

- name: Track a demo job so there's something to see right away
  ansible.builtin.include_role:
    name: ssm_command
  vars:
    ssm_instance_id: "{{ sandbox_instance_id }}"
    ssm_timeout: 60
    ssm_script: |
      set -e
      # stdin/stdout/stderr must all point at a path that exists on ANY
      # instance the job might restore onto -- CRIU restores a checkpointed
      # process's file descriptors by reopening them at their original
      # absolute path, so something instance-local like /tmp/demo-job.log
      # would exist on the original instance but not a replacement, and
      # restore would fail outright (found the hard way against a real FIS
      # interruption test). /dev/null exists identically everywhere.
      nohup /usr/local/bin/surviva run --priority 5 -- sleep 3600 < /dev/null > /dev/null 2>&1 &
      disown
      sleep 1
      /usr/local/bin/surviva list
  when: register_demo_job | default(true)
