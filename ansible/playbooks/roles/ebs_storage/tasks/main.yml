---
# Creates (but does not attach) the sandbox's checkpoint EBS volume, in EBS
# mode only. Created unattached, before the launch template and before the
# sandbox instance exists, so its real volume id can be baked into the
# launch template's default user-data (see roles/launch_template).
# Attachment happens later in roles/sandbox_instance, once the instance
# that will actually use it exists.

- name: Create the checkpoint EBS volume
  amazon.aws.ec2_vol:
    zone: "{{ availability_zone }}"
    volume_size: "{{ ebs_volume_size_gb }}"
    volume_type: gp3
    region: "{{ aws_region }}"
    tags: "{{ resource_tags | combine({'Name': name_prefix + '-checkpoint-volume', 'surviva-sandbox': name_prefix}) }}"
    state: present
  register: _ebs_vol

- name: Record the checkpoint volume id
  ansible.builtin.set_fact:
    ebs_volume_id: "{{ _ebs_vol.volume.id }}"
