---
# Runs `terraform destroy` with whatever key/value pairs are in `tf_vars`.
# The caller is responsible for supplying values that match what was last
# applied closely enough for terraform to plan a clean removal (in
# particular launch_template_id, which has no default) -- destroy_sandbox.yml
# rediscovers these live rather than trusting a possibly-stale facts file.

- name: Build -var arguments from tf_vars
  # See terraform_infra/tasks/apply.yml for why only maps/bools are JSON-encoded.
  ansible.builtin.set_fact:
    _tf_var_args: "{{ _tf_var_args | default([]) + ['-var=' + item.key + '=' + ((item.value | to_json) if (item.value is mapping or item.value is sameas true or item.value is sameas false) else (item.value | string))] }}"
  loop: "{{ tf_vars | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: terraform destroy
  ansible.builtin.command:
    argv: "{{ ['terraform', 'destroy', '-auto-approve', '-input=false'] + _tf_var_args }}"
    chdir: "{{ terraform_dir }}"
  changed_when: true

- name: Clear the accumulated -var arguments
  ansible.builtin.set_fact:
    _tf_var_args: []
