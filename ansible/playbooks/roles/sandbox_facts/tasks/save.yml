---
# Persists every resource id gathered during setup to a local, gitignored
# facts file (a fast-path cache only -- destroy_sandbox.yml treats live,
# tag-based discovery as the actual source of truth, since an
# orchestrator-launched replacement instance never appears here). Then
# prints a human-facing summary of how to actually use the sandbox.

- name: Ensure the facts directory exists
  ansible.builtin.file:
    path: "{{ facts_dir }}"
    state: directory
    mode: "0700"

- name: Write the facts file
  ansible.builtin.copy:
    dest: "{{ facts_file }}"
    mode: "0600"
    content: |
      {{ {
        'name_prefix': name_prefix,
        'aws_region': aws_region,
        'storage_mode': storage_mode,
        'sandbox_ami_id': sandbox_ami_id,
        'sandbox_ami_snapshot_id': sandbox_ami_snapshot_id,
        'launch_template_id': launch_template_id,
        'sandbox_instance_id': sandbox_instance_id,
        'ebs_volume_id': ebs_volume_id | default(None),
        'fis_experiment_template_id': tf_outputs.fis_experiment_template_id | default(None),
        'checkpoints_bucket_name': tf_outputs.checkpoints_bucket_name | default(None),
        'jobs_table_name': tf_outputs.jobs_table_name | default(None),
        'cloudwatch_log_group_name': tf_outputs.cloudwatch_log_group_name | default(None),
      } | to_nice_json }}

- name: Build the FIS fire command, if a template was created
  ansible.builtin.set_fact:
    _fis_fire_cmd: >-
      aws fis start-experiment --experiment-template-id {{ tf_outputs.fis_experiment_template_id }}
      --region {{ aws_region }}
  when: (tf_outputs.fis_experiment_template_id | default('')) | length > 0

- name: Print the sandbox summary
  ansible.builtin.debug:
    msg:
      - "=== surviva sandbox is ready ==="
      - "Instance:        {{ sandbox_instance_id }} ({{ storage_mode }} storage mode)"
      - "Connect:         aws ssm start-session --target {{ sandbox_instance_id }} --region {{ aws_region }}"
      - "Track a job:     surviva run -- <your command>"
      - "List jobs:       surviva list"
      - "{{ 'Fire a real Spot interruption: ' + _fis_fire_cmd if _fis_fire_cmd is defined else 'FIS demo template not created (create_fis_demo_template is false).' }}"
      - "Tail logs:       aws logs tail {{ tf_outputs.cloudwatch_log_group_name }} --follow --region {{ aws_region }}"
      - "Facts saved to:  {{ facts_file }}"
      - "When you're done: ansible-playbook playbooks/destroy_sandbox.yml"
