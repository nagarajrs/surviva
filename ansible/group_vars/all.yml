---
# ---------------------------------------------------------------------------
# Required: you MUST set these for your account before running setup_sandbox.
# There is deliberately no default-VPC auto-discovery here -- accounts
# without a default VPC (or with one in an unexpected AZ) would otherwise
# fail confusingly deep into the run instead of at the preflight check.
# ---------------------------------------------------------------------------
subnet_id: ""              # e.g. subnet-0123456789abcdef0 -- used for the AMI
                           # builder and (S3 mode) the sandbox instance
availability_zone: ""      # the AZ subnet_id belongs to, e.g. us-east-1a

# ---------------------------------------------------------------------------
# Everything below has a reasonable default; override in this file or with
# -e on the command line as you like.
# ---------------------------------------------------------------------------
name_prefix: surviva-sandbox
aws_region: us-east-1
instance_type: t3.micro

# "s3" (simpler, no volume/AZ pinning) or "ebs" (creates+attaches a real
# checkpoint volume, exercises AZ pinning).
storage_mode: s3
ebs_volume_size_gb: 8
ebs_attach_device: /dev/sdf   # must match infra/terraform's own var.ebs_attach_device default

# az_subnet_map is only meaningful in EBS mode -- it's what lets the
# orchestrator's replacement instance land in the same AZ as the checkpoint
# volume. Defaults to the single {availability_zone: subnet_id} pair above;
# override if you want the sandbox's own AZ mapping to differ from that.
az_subnet_map: "{{ {availability_zone: subnet_id} if availability_zone else {} }}"

# CRIU version to build into the sandbox AMI -- keep in sync with
# docs/deployment/technical.md.
criu_git_ref: v4.2

# Base AMI the AMI-builder instance itself launches from (Amazon Linux 2023,
# x86_64). Resolved at runtime via ec2_ami_info against this owner+filter.
base_ami_owner: amazon
base_ami_name_filter: "al2023-ami-2023*-x86_64"

# Ready-to-fire AWS FIS experiment template, not auto-run.
create_fis_demo_template: true
fis_interruption_delay: PT2M

# Isolates this sandbox's Terraform state from infra/terraform's default
# workspace (which may have its own, unrelated state).
terraform_workspace: sandbox

resource_tags:
  Project: "{{ name_prefix }}"
  ManagedBy: ansible-sandbox

# Internal paths -- not usually something you need to change.
repo_root: "{{ playbook_dir }}/../.."
terraform_dir: "{{ repo_root }}/infra/terraform"
local_build_dir: "{{ playbook_dir }}/../files"
facts_dir: "{{ playbook_dir }}/../.sandbox_facts"
facts_file: "{{ facts_dir }}/{{ name_prefix }}.json"
